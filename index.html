<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="src/assets/foundation/legacy/Logo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <title>Unnati Mart | Premium Shopping</title>
</head>

<body>
  <div id="root">
    <!-- Preloader -->
    <style>
      #root:empty .preloader {
        display: flex;
      }

      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: 'Outfit', sans-serif;
      }

      .preloader-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        animation: pulse-glow 2s infinite ease-in-out;
      }

      .loader-bar-container {
        width: 140px;
        height: 3px;
        background: #f1f5f9;
        border-radius: 9999px;
        margin-top: 24px;
        overflow: hidden;
        position: relative;
      }

      .loader-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #d97706, #f59e0b, #d97706);
        background-size: 200% 100%;
        position: absolute;
        top: 0;
        left: -100%;
        animation: loading-slide 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes pulse-glow {
        0%, 100% {
          transform: scale(0.95);
          filter: drop-shadow(0 0 5px rgba(217, 119, 6, 0.2)) opacity(0.8);
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 20px rgba(217, 119, 6, 0.6)) opacity(1);
        }
      }

      @keyframes loading-slide {
        0% {
          left: -100%;
        }
        50% {
          left: 0%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
    <div class="preloader">
      <img src="src/assets/foundation/legacy/Logo.webp" class="preloader-logo" alt="Unnati Mart" />
      <div style="margin-top: 16px; font-size: 20px; font-weight: 900; color: #0f172a; letter-spacing: -0.05em; text-transform: uppercase;">
        UNNATI <span style="color: #d97706; font-style: italic;">MART</span>
      </div>
      <div class="loader-bar-container">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
